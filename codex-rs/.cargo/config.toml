[build]
target-dir = "/Users/adamidrees/local terminal/.build-cache/codex-target"
jobs = 1
incremental = false

[net]
# Since 0.170.0 the v8 crate is a git patch (openai-oss-forks/rusty_v8) whose
# Chromium submodules come from chromium.googlesource.com. Cargo's built-in
# git (libgit2 over SecureTransport) stalled there for good on 2026-11-19
# ("spurious network error ... connection closed", 0% CPU for 13 minutes);
# the git command line fetches them.
git-fetch-with-cli = true

[env]
# Roughly one arena per four CPUs reduces idle RSS after Linux musl conversations unload.
JEMALLOC_SYS_WITH_MALLOC_CONF = "narenas_ratio:0.25"

# curl-sys enables its NTLM sources but does not set the flag required by libcurl 8.21.
CFLAGS_aarch64_pc_windows_gnullvm = "-DCURL_ENABLE_NTLM"
CFLAGS_aarch64_pc_windows_msvc = "-DCURL_ENABLE_NTLM"
CFLAGS_x86_64_pc_windows_gnullvm = "-DCURL_ENABLE_NTLM"
CFLAGS_x86_64_pc_windows_msvc = "-DCURL_ENABLE_NTLM"

# The code-mode host (required since 0.153 for every tool call) links V8 with
# the sandbox feature. denoland publishes no ptrcomp_sandbox prebuilt, so use
# OpenAI's own build (github.com/openai/codex release rusty-v8-v152.2.0, the
# v8 crate of rust-v0.170.0), vendored under the workspace's vendor/rusty-v8 and
# checked against third_party/v8/rusty_v8_152_2_0.sha256 of this tree.
RUSTY_V8_ARCHIVE = "/Users/adamidrees/local terminal/vendor/rusty-v8/v152.2.0/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz"
RUSTY_V8_SRC_BINDING_PATH = "/Users/adamidrees/local terminal/vendor/rusty-v8/v152.2.0/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs"

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]

# MSVC emits a warning about code that may trip "Cortex-A53 MPCore processor bug #843419" (see
# https://developer.arm.com/documentation/epm048406/latest) which is sometimes emitted by LLVM.
# Since Arm64 Windows 10+ isn't supported on that processor, it's safe to disable the warning.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "link-arg=/arm64hazardfree"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
